<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>排球轉播計分系統 (Firebase 同步版)</title>
<!-- Firebase SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Arial', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
    touch-action: manipulation;
  }

  body {
    background-color: transparent;
    overflow-x: hidden;
    padding: 10px;
    color: #ffffff;
  }

  body.view-live #summary-section,
  body.view-live #control-section {
    display: none !important;
  }

  body.view-summary #live-section,
  body.view-summary #control-section {
    display: none !important;
  }

  body.view-control {
    background-color: #0f131a;
    overflow-y: auto;
    padding: 20px;
  }

  .preview-label {
    display: none;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 8px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  body.view-control .preview-label {
    display: block;
  }

  .scale-outer {
    width: 100%;
    max-width: 1100px;
    overflow: hidden;
    position: relative;
  }

  body.view-control #live-section,
  body.view-control #summary-section {
    margin-bottom: 26px;
    width: 100%;
    max-width: 1100px;
  }

  .scale-inner {
    width: 1080px;
    transform-origin: top left;
  }

  /* =========================================================
     1. 排球場上即時轉播計分板 (?view=volleyball_live)
     ========================================================= */
  .live-scorebug-wrapper {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 1080px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.16);
    user-select: none;
  }

  .live-scorebug {
    display: flex;
    align-items: stretch;
    height: 92px;
    background: #11161f;
    width: 100%;
  }

  .live-team {
    display: flex;
    align-items: stretch;
    flex: 1;
    min-width: 0;
  }

  .live-team.away {
    flex-direction: row-reverse;
  }

  /* 發球權金色側標 (位於兩隊最外側) */
  .live-serve-tab {
    width: 0;
    opacity: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #d7b47c 0%, #b88c4a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }

  .live-serve-tab.active {
    width: 48px;
    opacity: 1;
  }

  .live-team.home .live-serve-tab.active {
    border-right: 2px solid rgba(255, 255, 255, 0.35);
  }

  .live-team.away .live-serve-tab.active {
    border-left: 2px solid rgba(255, 255, 255, 0.35);
  }

  .serve-ball-svg {
    width: 30px;
    height: 30px;
    fill: #5a3510;
    filter: drop-shadow(0 1px 2px rgba(255, 255, 255, 0.25));
    flex-shrink: 0;
  }

  .live-team-banner {
    display: flex;
    align-items: center;
    padding: 0 16px;
    flex: 1;
    min-width: 0;
    position: relative;
    gap: 14px;
  }

  .live-team.home .live-team-banner {
    flex-direction: row;
  }

  .live-team.away .live-team-banner {
    flex-direction: row-reverse;
  }

  .live-logo {
    width: 72px;
    height: 72px;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    object-position: center;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.65));
    flex-shrink: 0;
  }

  .live-info {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }

  .live-name {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 0 3px 6px rgba(0,0,0,0.75);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
    width: 100%;
    line-height: 1.15;
  }

  .live-score-box {
    width: 118px;
    height: 92px;
    background: #090c12;
    position: relative;
    overflow: hidden;
    border-left: 1px solid rgba(255,255,255,0.12);
    border-right: 1px solid rgba(255,255,255,0.12);
    flex-shrink: 0;
  }

  .score-track {
    width: 100%;
    height: 276px;
    display: flex;
    flex-direction: column;
    transform: translateY(0);
  }

  .score-slot {
    width: 118px;
    height: 92px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    font-weight: 900;
    flex-shrink: 0;
  }

  .score-slot.plus-badge {
    color: #38bdf8;
    font-size: 42px;
    background: #090c12;
  }

  @keyframes slideScoreSequence {
    0%   { transform: translateY(0); }
    18%  { transform: translateY(-92px); }
    72%  { transform: translateY(-92px); }
    92%  { transform: translateY(-184px); }
    100% { transform: translateY(-184px); }
  }

  .animating-slide {
    animation: slideScoreSequence 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .live-center-period {
    width: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #141923;
    color: #facc15;
    flex-shrink: 0;
    border-left: 1px solid rgba(255,255,255,0.12);
    border-right: 1px solid rgba(255,255,255,0.12);
  }

  .live-center-set-title {
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.1;
  }

  .live-center-set-score {
    font-size: 20px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 2px;
    margin-top: 2px;
  }

  /* 底部資訊列與暫停牌 (1st / 2nd TIME OUT) */
  .live-bottom-bar {
    background: #090d14;
    color: #ffffff;
    min-height: 44px;
    padding: 4px 18px;
    border-top: 2px solid rgba(255, 255, 255, 0.12);
    display: grid;
    grid-template-columns: 452px 140px 452px;
    align-items: center;
    justify-content: center;
    width: 100%;
    position: relative;
  }

  .live-to-slot {
    display: flex;
    align-items: center;
    min-height: 34px;
    z-index: 2;
  }

  .live-to-slot.home {
    justify-content: flex-end;
    padding-right: 4px;
  }

  .live-to-slot.away {
    justify-content: flex-start;
    padding-left: 4px;
  }

  .timeout-badge {
    display: none;
    background: linear-gradient(180deg, #991b1b 0%, #7f1d1d 100%);
    color: #ffffff;
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 1.2px;
    padding: 4px 18px;
    border-radius: 3px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.65);
    text-transform: uppercase;
    line-height: 1.1;
    animation: popTimeout 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .timeout-badge.active {
    display: inline-flex;
    align-items: baseline;
  }

  .timeout-badge sup {
    font-size: 12px;
    margin-right: 4px;
    font-weight: 900;
  }

  @keyframes popTimeout {
    0% { transform: translateY(-6px) scale(0.95); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  .live-title-wrap {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 1;
  }

  .live-title-text {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-align: center;
    color: #f8fafc;
    line-height: 1.25;
    white-space: pre;
    transition: opacity 0.2s ease;
  }

  /* 當任一隊顯示暫停牌時，自動淡化底欄中央標題避免視覺擁擠 */
  .live-bottom-bar.has-timeout .live-title-text {
    opacity: 0.22;
  }

  /* =========================================================
     2. 排球局數總計分板 (?view=volleyball_summary)
     ========================================================= */
  .scoreboard {
    width: 1080px;
    background: linear-gradient(180deg, #161c24 0%, #090c10 100%);
    color: #ffffff;
    border-bottom: 3px solid #2a3546;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
    user-select: none;
    border-radius: 8px;
    overflow: hidden;
  }

  .row {
    display: grid;
    grid-template-columns: 360px 110px 100px 100px 100px 100px 100px 110px;
    align-items: center;
  }

  .header-row {
    min-height: 56px;
    padding: 6px 0;
    background: #0c1017;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 1px;
    border-bottom: 1px solid #262f3d;
  }

  .league-title-wrap {
    width: 360px;
    padding-left: 18px;
    padding-right: 14px;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  .league-title {
    font-style: italic;
    font-size: 22px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 1px;
    line-height: 1.25;
    white-space: pre;
  }

  .col-q { text-align: center; color: #e0e6ed; }
  .col-q sup { font-size: 13px; }
  .col-total-header {
    text-align: center;
    color: #d4af37;
    font-size: 22px;
    letter-spacing: 2px;
  }

  .team-row {
    height: 68px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .team-banner {
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 32px 0 16px;
    clip-path: polygon(0 0, 100% 0, 93% 100%, 0% 100%);
    gap: 14px;
  }

  .team-logo {
    height: 56px;
    width: 56px;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    object-position: center;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.55));
    flex-shrink: 0;
  }

  .team-name {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 1px 2px 5px rgba(0, 0, 0, 0.65);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    text-align: center;
  }

  .score-q {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    color: #b0b8c4;
  }

  .score-total {
    text-align: center;
    font-size: 38px;
    font-weight: 900;
    color: #ffffff;
  }

  /* =========================================================
     3. 控制台
     ========================================================= */
  #control-section {
    width: 100%;
    max-width: 1080px;
    background: #181d26;
    border: 1px solid #2a3140;
    border-radius: 10px;
    padding: 18px;
  }

  .ctrl-top-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-bottom: 14px;
    margin-bottom: 16px;
    border-bottom: 1px solid #2a3140;
  }

  .fb-status-badge {
    font-size: 12px;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 999px;
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
  }

  .fb-status-badge.online {
    background: rgba(22, 163, 74, 0.15);
    color: #4ade80;
    border-color: #16a34a;
  }

  .period-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .period-btn {
    background: #283040;
    color: #cbd5e1;
    border: 1px solid #3b465c;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }

  .period-btn.active {
    background: #eab308;
    color: #000000;
    border-color: #facc15;
  }

  .teams-ctrl-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 768px) {
    .teams-ctrl-grid {
      grid-template-columns: 1fr;
    }
  }

  .team-ctrl-card {
    background: #1f2633;
    border: 1px solid #313b4e;
    border-radius: 8px;
    padding: 16px;
  }

  .ctrl-row {
    margin-bottom: 12px;
  }

  .ctrl-row:last-child {
    margin-bottom: 0;
  }

  .ctrl-row label {
    display: block;
    font-size: 12.5px;
    color: #94a3b8;
    margin-bottom: 5px;
    font-weight: bold;
  }

  .input-with-color {
    display: flex;
    gap: 8px;
  }

  .team-name-input {
    flex: 1;
    background: #0f131a;
    border: 1px solid #3b465c;
    border-radius: 6px;
    padding: 8px 12px;
    color: #ffffff;
    font-size: 15px;
    font-weight: bold;
    resize: vertical;
  }

  .color-picker-input {
    width: 40px;
    height: 38px;
    border: 1px solid #3b465c;
    border-radius: 6px;
    background: none;
    cursor: pointer;
    padding: 0;
  }

  .logo-upload-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    background: #333d52;
    color: #ffffff;
    border: 1px solid #475569;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }

  .ctrl-btn:hover {
    background: #404c66;
  }

  .score-btn-group {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .score-btn {
    padding: 14px 0;
    border: none;
    border-radius: 6px;
    font-size: 17px;
    font-weight: 900;
    color: #ffffff;
    cursor: pointer;
    transition: transform 0.1s;
  }

  .score-btn:active {
    transform: scale(0.95);
  }

  .btn-p1 { background: #0284c7; }
  .btn-p2 { background: #16a34a; }
  .btn-m1 { background: #dc2626; }

  /* 發球權與暫停控制列 */
  .tactical-btn-group {
    display: grid;
    grid-template-columns: 1.1fr 1.1fr auto;
    gap: 8px;
    align-items: stretch;
  }

  .serve-btn {
    background: #283040;
    color: #e2e8f0;
    border: 1px solid #475569;
    border-radius: 6px;
    padding: 11px 10px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  .serve-btn.active {
    background: linear-gradient(180deg, #d7b47c 0%, #b88c4a 100%);
    color: #2b1704;
    border-color: #fde68a;
    box-shadow: 0 0 12px rgba(215, 180, 124, 0.45);
  }

  .to-btn {
    background: #881337;
    color: #ffffff;
    border: 1px solid #be123c;
    border-radius: 6px;
    padding: 11px 10px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  .to-btn.active {
    background: #dc2626;
    border-color: #fca5a5;
    box-shadow: 0 0 12px rgba(220, 38, 38, 0.5);
  }

  .to-sub-btn {
    background: #283040;
    color: #cbd5e1;
    border: 1px solid #3b465c;
    border-radius: 6px;
    padding: 0 12px;
    font-size: 12.5px;
    font-weight: bold;
    cursor: pointer;
  }

  .to-sub-btn:hover {
    background: #333d52;
  }
</style>
</head>
<body>

  <!-- 1. 場上即時計分板 (?view=volleyball_live) -->
  <div id="live-section">
    <div class="preview-label">▼ 預覽 1：場上即時計分板（OBS 連結參數：?view=volleyball_live）</div>
    <div class="scale-outer" id="scale-outer-live">
      <div class="scale-inner" id="scale-inner-live">
        <div class="live-scorebug-wrapper">
          <div class="live-scorebug">
            <!-- 主隊 (左側) -->
            <div class="live-team home">
              <!-- 主隊發球圖示 (最左側) -->
              <div class="live-serve-tab" id="live-t1-serve">
                <svg class="serve-ball-svg" viewBox="0 0 24 24">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 2.07c3.07.38 5.67 2.35 6.96 5.08-2.34-.65-4.88-.32-6.96.85V4.07zM8.1 4.96c.88-.48 1.86-.79 2.9-.89v4.85c-1.85.85-3.32 2.37-4.08 4.25-1.12-1.89-1.36-4.18-.57-6.29.46-.73 1.05-1.38 1.75-1.92zM4.26 14.54c.67-2.29 2.27-4.18 4.44-5.15.96 1.73 2.58 3.04 4.54 3.61l-1.92 3.33c-2.73-.19-5.26-1.56-7.06-1.79zm7.74 5.46c-1.15 0-2.25-.24-3.25-.68l1.97-3.41c2.22.12 4.41-.62 6.03-2.12.92 1.63 1.24 3.55.89 5.41-1.61.52-3.58.8-5.64.8zm6.92-2.22c.13-1.63-.29-3.27-1.19-4.65 1.1-.88 2.45-1.38 3.86-1.42.11.61.17 1.24.17 1.89 0 1.56-.45 3.01-1.23 4.24-.52-.04-1.06-.05-1.61-.06z"/>
                </svg>
              </div>
              <div class="live-team-banner" id="live-t1-bg" style="background: #0d5c3d;">
                <img id="live-t1-logo" class="live-logo" src="" alt="" style="display:none;">
                <div class="live-info">
                  <div class="live-name" id="live-t1-name">臺中連莊</div>
                </div>
              </div>
              <div class="live-score-box" id="box-t1">
                <div class="score-track" id="track-t1">
                  <div class="score-slot" id="slot-t1-cur">0</div>
                  <div class="score-slot plus-badge" id="slot-t1-plus">+1</div>
                  <div class="score-slot" id="slot-t1-next">0</div>
                </div>
              </div>
            </div>

            <!-- 排球專屬中央局數顯示 -->
            <div class="live-center-period">
              <div class="live-center-set-title" id="live-set-title">SET 1</div>
              <div class="live-center-set-score" id="live-set-score">0 - 0</div>
            </div>

            <!-- 客隊 (右側，因 row-reverse 故發球圖示在最外側右端) -->
            <div class="live-team away">
              <div class="live-serve-tab" id="live-t2-serve">
                <svg class="serve-ball-svg" viewBox="0 0 24 24">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 2.07c3.07.38 5.67 2.35 6.96 5.08-2.34-.65-4.88-.32-6.96.85V4.07zM8.1 4.96c.88-.48 1.86-.79 2.9-.89v4.85c-1.85.85-3.32 2.37-4.08 4.25-1.12-1.89-1.36-4.18-.57-6.29.46-.73 1.05-1.38 1.75-1.92zM4.26 14.54c.67-2.29 2.27-4.18 4.44-5.15.96 1.73 2.58 3.04 4.54 3.61l-1.92 3.33c-2.73-.19-5.26-1.56-7.06-1.79zm7.74 5.46c-1.15 0-2.25-.24-3.25-.68l1.97-3.41c2.22.12 4.41-.62 6.03-2.12.92 1.63 1.24 3.55.89 5.41-1.61.52-3.58.8-5.64.8zm6.92-2.22c.13-1.63-.29-3.27-1.19-4.65 1.1-.88 2.45-1.38 3.86-1.42.11.61.17 1.24.17 1.89 0 1.56-.45 3.01-1.23 4.24-.52-.04-1.06-.05-1.61-.06z"/>
                </svg>
              </div>
              <div class="live-team-banner" id="live-t2-bg" style="background: #1b4965;">
                <img id="live-t2-logo" class="live-logo" src="" alt="" style="display:none;">
                <div class="live-info">
                  <div class="live-name" id="live-t2-name">台鋼天鷹</div>
                </div>
              </div>
              <div class="live-score-box" id="box-t2">
                <div class="score-track" id="track-t2">
                  <div class="score-slot" id="slot-t2-cur">0</div>
                  <div class="score-slot plus-badge" id="slot-t2-plus">+1</div>
                  <div class="score-slot" id="slot-t2-next">0</div>
                </div>
              </div>
            </div>
          </div>

          <!-- 底部資訊列與兩隊 TIME OUT 顯示區 -->
          <div class="live-bottom-bar" id="live-bottom-bar">
            <div class="live-to-slot home">
              <div class="timeout-badge" id="live-t1-to">1<sup>st</sup> TIME OUT</div>

  <!-- 2. 局數總計分板 (?view=volleyball_summary) -->
  <div id="summary-section">

  <!-- 3. 控制台 -->
  <div id="control-section">
    <div class="ctrl-top-bar">

        <button class="period-btn" id="pbtn-1" onclick="changeSet(1)">Set 1</button>
        <button class="period-btn" id="pbtn-2" onclick="changeSet(2)">Set 2</button>
        <button class="period-btn" id="pbtn-3" onclick="changeSet(3)">Set 3</button>
        <button class="period-btn" id="pbtn-4" onclick="changeSet(4)">Set 4</button>
        <button class="period-btn" id="pbtn-5" onclick="changeSet(5)">Set 5</button>

      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">

        <button class="ctrl-btn" onclick="switchServe()">🏐 切換發球</button>

            <button class="score-btn btn-m1" onclick="addScore('t1', -1)">-1</button>

      <!-- 客隊控制卡 -->
      <div class="team-ctrl-card">
        <div class="ctrl-row">
          <label>客隊名稱 & 代表色</label>
          <div class="input-with-color">
            <input type="text" class="team-name-input" id="in-t2-name" value="台鋼天鷹" oninput="updateTeamMeta('t2')">
            <input type="color" class="color-picker-input" id="in-t2-color" value="#1b4965" oninput="updateTeamMeta('t2')">

          <label>球隊 Logo</label>
          <div class="logo-upload-row">
            <button class="ctrl-btn" onclick="document.getElementById('file-t2').click()">📁 選擇圖片上傳</button>
            <button class="ctrl-btn" id="del-logo-t2" style="display:none;" onclick="removeLogo('t2')">✕ 移除</button>
            <input type="file" id="file-t2" accept="image/*" style="display:none;" onchange="uploadLogo('t2', this)">
          </div>
        </div>
        <div class="ctrl-row">
          <label>發球權 & 暫停控制 (本局已用暫停：<span id="to-status-t2">0 / 2</span>)</label>
          <div class="tactical-btn-group">
            <button class="serve-btn" id="btn-serve-t2" onclick="toggleServe('t2')">🏐 發球權</button>
            <button class="to-btn" id="btn-to-t2" onclick="triggerTimeOut('t2')">⏱️ TO +1</button>
            <button class="to-sub-btn" onclick="hideTimeOut('t2')" title="收起畫面上的暫停字卡">關閉顯示</button>
          </div>
        </div>
        <div class="ctrl-row">
          <label>加扣分控制</label>
          <div class="score-btn-group">
            <button class="score-btn btn-p1" onclick="addScore('t2', 1)">+1</button>
            <button class="score-btn btn-p2" onclick="addScore('t2', 2)">+2</button>
            <button class="score-btn btn-m1" onclick="addScore('t2', -1)">-1</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // 防止行動裝置雙擊縮放
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      if (e.cancelable) e.preventDefault();
      if (e.target && typeof e.target.click === 'function') e.target.click();
    }
    lastTouchEnd = now;
  }, { passive: false });

  // 視角模式判定
  const params = new URLSearchParams(window.location.search);
  const viewParam = params.get('view');
  if (viewParam === 'volleyball_live') {
    document.body.classList.add('view-live');
  } else if (viewParam === 'volleyball_summary') {
    document.body.classList.add('view-summary');
  } else {
    document.body.classList.add('view-control');
  }

  // =========================================================
  // Firebase 初始化與設定
  // =========================================================
  const STORAGE_KEY = 'volleyball_clean_state_v1';
  const channel = new BroadcastChannel('volleyball_clean_sync_v1');

  const firebaseConfig = {
    databaseURL: "https://volleyball-score-0000-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const dbRef = db.ref('volleyball_scoreboard');

  // 監測 Firebase 連線狀態
  db.ref('.info/connected').on('value', (snap) => {
    const badge = document.getElementById('fb-status');
    if (!badge) return;
    if (snap.val() === true) {
      badge.textContent = '🟢 Firebase 已同步';
      badge.classList.add('online');
    } else {
      badge.textContent = '🔴 離線 (本機模式)';
      badge.classList.remove('online');
    }
  });

  function getDefaultState() {
    return {
      gameTitle: '台灣職業排球聯賽 例行賽',
      currentSet: 1,
      servingTeam: '', // 't1' | 't2' | ''
      t1: {
        name: '臺中連莊',
        color: '#0d5c3d',
        logo: '',
        s1: 0, s2: '', s3: '', s4: '', s5: '',
        toCount: 0,
        toShowing: false
      },
      t2: {
        name: '台鋼天鷹',
        color: '#1b4965',
        logo: '',
        s1: 0, s2: '', s3: '', s4: '', s5: '',
        toCount: 0,
        toShowing: false
      },
      lastAction: null
    };
  }

  let state = loadState();
  let animTimers = { t1: null, t2: null };
  let lastProcessedActionId = null;
  let hasSyncedDataOnce = false;
  let isReloading = false;

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        return normalizeState(JSON.parse(saved));
      }
      return getDefaultState();
    } catch (e) {
      return getDefaultState();
    }
  }

  function normalizeState(raw) {
    const def = getDefaultState();
    if (!raw || typeof raw !== 'object') return def;
    const t1 = Object.assign({}, def.t1, raw.t1 || {});
    const t2 = Object.assign({}, def.t2, raw.t2 || {});
    t1.toCount = Number(t1.toCount) || 0;
    t1.toShowing = Boolean(t1.toShowing);
    t2.toCount = Number(t2.toCount) || 0;
    t2.toShowing = Boolean(t2.toShowing);

    return {
      gameTitle: raw.gameTitle !== undefined ? raw.gameTitle : def.gameTitle,
      currentSet: Number(raw.currentSet) || 1,
      servingTeam: raw.servingTeam || '',
      t1,
      t2,
      lastAction: raw.lastAction || null,
      updatedAt: raw.updatedAt || null
    };
  }

  function saveState(broadcast = true) {
    state.updatedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    if (broadcast) {
      channel.postMessage({ type: 'sync', state });
      dbRef.set(state).catch((err) => console.error('Firebase 寫入失敗:', err));
    }
  }

  // 強制清除本機快取並重整頁面（供控制台與 OBS 同步觸發）
  function wipeLocalAndReload() {
    if (isReloading) return;
    isReloading = true;
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.clear();
      sessionStorage.clear();
    } catch (e) {}
    state = getDefaultState();
    renderUI();
    setTimeout(() => {
      window.location.reload();
    }, 120);
  }

  // 監聽 Firebase 即時資料庫變動
  dbRef.on('value', (snapshot) => {
    if (isReloading) return;
    const val = snapshot.val();

    if (val && val._forceReset) {
      wipeLocalAndReload();
      return;
    }

    if (val === null) {
      if (hasSyncedDataOnce) {
        wipeLocalAndReload();
      } else {
        localStorage.removeItem(STORAGE_KEY);
        state = getDefaultState();
        renderUI();
      }
      return;
    }

    hasSyncedDataOnce = true;
    state = normalizeState(val);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    const action = state.lastAction;
    if (
      action &&
      action.id &&
      action.id !== lastProcessedActionId &&
      Date.now() - action.timestamp < 5000
    ) {
      lastProcessedActionId = action.id;
      renderUI(action.teamKey);
      playScoreAnimation(action.teamKey, action.delta, action.oldScore, action.newScore);
    } else {
      if (action && action.id) lastProcessedActionId = action.id;
      renderUI();
    }
  });

  function getTeamSetsWon(teamObj) {
    let setsWon = 0;
    for (let i = 1; i <= 5; i++) {
      const score = Number(teamObj[`s${i}`]);
      const opponentKey = teamObj === state.t1 ? 't2' : 't1';
      const oppScore = Number(state[opponentKey][`s${i}`]);

      if (!isNaN(score) && !isNaN(oppScore) && teamObj[`s${i}`] !== '' && teamObj[`s${i}`] !== null) {
        const target = i === 5 ? 15 : 25;
        if (score >= target && score - oppScore >= 2) {
          setsWon++;
        }
      }
    }
    return setsWon;
  }

  function adjustResponsiveScale() {
    const pairs = [
      { outer: document.getElementById('scale-outer-live'), inner: document.getElementById('scale-inner-live') },
      { outer: document.getElementById('scale-outer-summary'), inner: document.getElementById('scale-inner-summary') }
    ];

    pairs.forEach(({ outer, inner }) => {
      if (!outer || !inner || outer.offsetParent === null) return;
      const availWidth = outer.clientWidth || (window.innerWidth - 20);
      const scale = Math.min(1, availWidth / 1080);
      inner.style.transform = `scale(${scale})`;
      outer.style.height = `${Math.ceil(inner.offsetHeight * scale)}px`;
    });
  }

  window.addEventListener('resize', adjustResponsiveScale);
  window.addEventListener('orientationchange', () => setTimeout(adjustResponsiveScale, 150));

  function renderUI(skipTeamKey = null) {
    const titleText = state.gameTitle || '台灣職業排球聯賽 例行賽';
    document.getElementById('live-title-display').textContent = titleText;
    const sumTitle = document.getElementById('sum-league-title');
    if (sumTitle) sumTitle.textContent = titleText;

    const gameTitleInput = document.getElementById('in-game-title');
    if (gameTitleInput && document.activeElement !== gameTitleInput) {
      gameTitleInput.value = state.gameTitle;
    }

    document.getElementById('live-set-title').textContent = `SET ${state.currentSet}`;
    const t1Sets = getTeamSetsWon(state.t1);
    const t2Sets = getTeamSetsWon(state.t2);
    document.getElementById('live-set-score').textContent = `${t1Sets} - ${t2Sets}`;

    for (let p = 1; p <= 5; p++) {
      const btn = document.getElementById(`pbtn-${p}`);
      if (btn) btn.classList.toggle('active', state.currentSet === p);
    }

    // 發球權顯示更新
    ['t1', 't2'].forEach(k => {
      const isServing = state.servingTeam === k;
      const serveTab = document.getElementById(`live-${k}-serve`);
      if (serveTab) serveTab.classList.toggle('active', isServing);

      const serveBtn = document.getElementById(`btn-serve-${k}`);
      if (serveBtn) {
        serveBtn.classList.toggle('active', isServing);
        serveBtn.textContent = isServing ? '🏐 發球中' : '🏐 發球權';
      }
    });

    // 暫停牌與底欄狀態更新
    const anyTimeoutShowing = (state.t1.toShowing && state.t1.toCount > 0) || (state.t2.toShowing && state.t2.toCount > 0);
    const bottomBar = document.getElementById('live-bottom-bar');
    if (bottomBar) bottomBar.classList.toggle('has-timeout', anyTimeoutShowing);

    ['t1', 't2'].forEach(k => {
      const t = state[k];
      const curSetScore = (t[`s${state.currentSet}`] !== null && t[`s${state.currentSet}`] !== undefined && t[`s${state.currentSet}`] !== '') ? t[`s${state.currentSet}`] : 0;

      document.getElementById(`live-${k}-name`).textContent = t.name;
      document.getElementById(`live-${k}-bg`).style.background = t.color;

      const liveLogo = document.getElementById(`live-${k}-logo`);
      if (t.logo) {
        liveLogo.src = t.logo;
        liveLogo.style.display = 'block';
      } else {
        liveLogo.style.display = 'none';
      }

      if (skipTeamKey !== k) {
        const track = document.getElementById(`track-${k}`);
        track.classList.remove('animating-slide');
        track.style.transform = 'translateY(0)';
        document.getElementById(`slot-${k}-cur`).textContent = curSetScore;
        document.getElementById(`slot-${k}-next`).textContent = curSetScore;
      }

      // 渲染 1st TIME OUT / 2nd TIME OUT 標籤
      const toBadge = document.getElementById(`live-${k}-to`);
      if (toBadge) {
        if (t.toShowing && t.toCount > 0) {
          const ordSup = t.toCount === 1 ? 'st' : 'nd';
          toBadge.innerHTML = `${t.toCount}<sup>${ordSup}</sup> TIME OUT`;
          toBadge.classList.add('active');
        } else {
          toBadge.classList.remove('active');
        }
      }

      // 控制台 TO 狀態顯示
      const toStatus = document.getElementById(`to-status-${k}`);
      if (toStatus) {
        toStatus.textContent = `${t.toCount || 0} / 2${t.toShowing ? ' (顯示中)' : ''}`;
      }
      const toBtn = document.getElementById(`btn-to-${k}`);
      if (toBtn) {
        toBtn.classList.toggle('active', Boolean(t.toShowing && t.toCount > 0));
      }

      // 總計分板 (Summary)
      document.getElementById(`sum-${k}-name`).textContent = t.name;
      document.getElementById(`sum-${k}-bg`).style.background = `linear-gradient(90deg, ${t.color}dd 0%, ${t.color} 100%)`;
      const sumLogo = document.getElementById(`sum-${k}-logo`);
      if (t.logo) {
        sumLogo.src = t.logo;
        sumLogo.style.display = 'block';
      } else {
        sumLogo.style.display = 'none';
      }

      for (let s = 1; s <= 5; s++) {
        const val = t[`s${s}`];
        const el = document.getElementById(`sum-${k}-s${s}`);
        if (el) el.textContent = (val === null || val === '' || val === undefined) ? '' : val;
      }
      document.getElementById(`sum-${k}-sets`).textContent = getTeamSetsWon(t);

      const nameInput = document.getElementById(`in-${k}-name`);
      if (nameInput && document.activeElement !== nameInput) nameInput.value = t.name;
      const colorInput = document.getElementById(`in-${k}-color`);
      if (colorInput && document.activeElement !== colorInput) colorInput.value = t.color;
      const delLogoBtn = document.getElementById(`del-logo-${k}`);
      if (delLogoBtn) delLogoBtn.style.display = t.logo ? 'inline-block' : 'none';
    });

    adjustResponsiveScale();
  }

  function playScoreAnimation(teamKey, delta, oldScore, newScore) {
    if (animTimers[teamKey]) {
      clearTimeout(animTimers[teamKey]);
      animTimers[teamKey] = null;
    }

    const track = document.getElementById(`track-${teamKey}`);
    const curSlot = document.getElementById(`slot-${teamKey}-cur`);
    const plusSlot = document.getElementById(`slot-${teamKey}-plus`);
    const nextSlot = document.getElementById(`slot-${teamKey}-next`);

    track.classList.remove('animating-slide');

    if (delta > 0) {
      curSlot.textContent = oldScore;
      plusSlot.textContent = `+${delta}`;
      nextSlot.textContent = newScore;
      void track.offsetWidth;
      track.classList.add('animating-slide');

      animTimers[teamKey] = setTimeout(() => {
        track.classList.remove('animating-slide');
        track.style.transform = 'translateY(0)';
        curSlot.textContent = newScore;
      }, 1360);
    } else {
      curSlot.textContent = newScore;
      nextSlot.textContent = newScore;
    }
  }

  // 發球權設定與切換
  function toggleServe(teamKey) {
    state.servingTeam = (state.servingTeam === teamKey) ? '' : teamKey;
    state.lastAction = null;
    saveState(true);
    renderUI();
  }

  function switchServe() {
    if (state.servingTeam === 't1') {
      state.servingTeam = 't2';
    } else {
      state.servingTeam = 't1';
    }
    state.lastAction = null;
    saveState(true);
    renderUI();
  }

  // TO +1 按鍵邏輯：0 -> 1st TIME OUT -> 2nd TIME OUT -> 歸零關閉
  function triggerTimeOut(teamKey) {
    const t = state[teamKey];
    const curCount = Number(t.toCount) || 0;

    if (curCount === 0) {
      t.toCount = 1;
      t.toShowing = true;
    } else if (curCount === 1) {
      t.toCount = 2;
      t.toShowing = true;
    } else {
      // 已達 2 次暫停時：若已隱藏則再次顯示 2nd TIME OUT；若正顯示中則歸零重設本局暫停
      if (!t.toShowing) {
        t.toShowing = true;
      } else {
        t.toCount = 0;
        t.toShowing = false;
      }
    }

    state.lastAction = null;
    saveState(true);
    renderUI();
  }

  // 隱藏畫面上的 TIME OUT 字卡（保留本局已叫暫停次數）
  function hideTimeOut(teamKey) {
    state[teamKey].toShowing = false;
    state.lastAction = null;
    saveState(true);
    renderUI();
  }

  function addScore(teamKey, delta) {
    const sKey = `s${state.currentSet}`;
    const oldScore = Number(state[teamKey][sKey] || 0);
    state[teamKey][sKey] = Math.max(0, oldScore + delta);
    const newScore = Number(state[teamKey][sKey]);

    // 當比賽繼續進行（加分）時，自動收起場上的暫停牌並將發球權交給得分方
    if (delta > 0) {
      state.t1.toShowing = false;
      state.t2.toShowing = false;
      state.servingTeam = teamKey;
    }

    const actionId = `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    lastProcessedActionId = actionId;
    state.lastAction = {
      id: actionId,
      teamKey,
      delta,
      oldScore,
      newScore,
      timestamp: Date.now()
    };

    saveState(false);
    renderUI(teamKey);
    playScoreAnimation(teamKey, delta, oldScore, newScore);

    channel.postMessage({ type: 'score_update', state, teamKey, delta, oldScore, newScore });
    dbRef.set(state).catch((err) => console.error('Firebase 得分更新失敗:', err));
  }

  function changeSet(s) {
    state.currentSet = s;
    const sKey = `s${s}`;
    if (state.t1[sKey] === null || state.t1[sKey] === undefined || state.t1[sKey] === '') state.t1[sKey] = 0;
    if (state.t2[sKey] === null || state.t2[sKey] === undefined || state.t2[sKey] === '') state.t2[sKey] = 0;

    // 換局時自動重設兩隊單局暫停次數與顯示狀態
    state.t1.toCount = 0;
    state.t1.toShowing = false;
    state.t2.toCount = 0;
    state.t2.toShowing = false;
    state.lastAction = null;

    saveState(true);
    renderUI();
  }

  function updateGameTitle() {
    state.gameTitle = document.getElementById('in-game-title').value;
    state.lastAction = null;
    saveState(true);
    renderUI();
  }

  function updateTeamMeta(teamKey) {
    state[teamKey].name = document.getElementById(`in-${teamKey}-name`).value;
    state[teamKey].color = document.getElementById(`in-${teamKey}-color`).value;
    state.lastAction = null;
    saveState(true);
    renderUI();
  }

  function uploadLogo(teamKey, inputEl) {
    const file = inputEl.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      state[teamKey].logo = e.target.result;
      state.lastAction = null;
      saveState(true);
      renderUI();
    };
    reader.readAsDataURL(file);
  }

  function removeLogo(teamKey) {
    state[teamKey].logo = '';
    const fileInput = document.getElementById(`file-${teamKey}`);
    if (fileInput) fileInput.value = '';
    state.lastAction = null;
    saveState(true);
    renderUI();
  }

  // =========================================================
  // 歸零重設：清除畫面、本機、Firebase 所有資料，並同步重整 OBS
  // =========================================================
  async function resetAllScores() {
    if (isReloading) return;

    channel.postMessage({ type: 'hard_reset' });

    try {
      await dbRef.set({ _forceReset: Date.now() });
      await db.ref().remove();
    } catch (err) {
      console.error('Firebase 刪除失敗:', err);
    }

    wipeLocalAndReload();
  }

  channel.onmessage = (ev) => {
    if (!ev.data) return;
    if (ev.data.type === 'hard_reset') {
      wipeLocalAndReload();
    } else if (ev.data.type === 'sync') {
      state = normalizeState(ev.data.state);
      renderUI();
    } else if (ev.data.type === 'score_update') {
      state = normalizeState(ev.data.state);
      if (state.lastAction && state.lastAction.id) {
        lastProcessedActionId = state.lastAction.id;
      }
      renderUI(ev.data.teamKey);
      playScoreAnimation(ev.data.teamKey, ev.data.delta, ev.data.oldScore, ev.data.newScore);
    }
  };

  window.addEventListener('storage', (ev) => {
    if (ev.key === STORAGE_KEY) {
      if (!ev.newValue) {
        wipeLocalAndReload();
      } else {
        state = normalizeState(JSON.parse(ev.newValue));
        renderUI();
      }
    }
  });

  renderUI();
</script>
</body>
</html>
