<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>排球轉播計分系統 (Firebase 同步版)</title>
<!-- Firebase SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Arial', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
    touch-action: manipulation;
  }

  body {
    background-color: transparent;
    overflow-x: hidden;
    padding: 10px;
    color: #ffffff;
  }

  body.view-live #summary-section,
  body.view-live #control-section {
    display: none !important;
  }

  body.view-summary #live-section,
  body.view-summary #control-section {
    display: none !important;
  }

  body.view-control {
    background-color: #0f131a;
    overflow-y: auto;
    padding: 20px;
  }

  .preview-label {
    display: none;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 8px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  body.view-control .preview-label {
    display: block;
  }

  .scale-outer {
    width: 100%;
    max-width: 1100px;
    overflow: hidden;
    position: relative;
  }

  body.view-control #live-section,
  body.view-control #summary-section {
    margin-bottom: 26px;
    width: 100%;
    max-width: 1100px;
  }

  .scale-inner {
    width: 1080px;
    transform-origin: top left;
  }

  /* =========================================================
     1. 排球場上即時轉播計分板 (?view=volleyball_live)
     ========================================================= */
  .live-scorebug-wrapper {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 1080px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.16);
    user-select: none;
  }

  .live-scorebug {
    display: flex;
    align-items: stretch;
    height: 92px;
    background: #11161f;
    width: 100%;
    position: relative;
    z-index: 3;
  }

  .live-team {
    display: flex;
    align-items: stretch;
    flex: 1;
    min-width: 0;
  }

  .live-team.away {
    flex-direction: row-reverse;
  }

  /* 發球權金色側標 (位於兩隊最外側) */
  .live-serve-tab {
    width: 0;
    opacity: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #d7b47c 0%, #b88c4a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: width 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }

  .live-serve-tab.active {
    width: 48px;
    opacity: 1;
  }

  .live-team.home .live-serve-tab.active {
    border-right: 2px solid rgba(255, 255, 255, 0.35);
  }

  .live-team.away .live-serve-tab.active {
    border-left: 2px solid rgba(255, 255, 255, 0.35);
  }

  .serve-ball-svg {
    width: 30px;
    height: 30px;
    fill: #5a3510;
    filter: drop-shadow(0 1px 2px rgba(255, 255, 255, 0.25));
    flex-shrink: 0;
  }

  .live-team-banner {
    display: flex;
    align-items: center;
    padding: 0 16px;
    flex: 1;
    min-width: 0;
    position: relative;
    gap: 14px;
    overflow: hidden;
  }

  .live-team.home .live-team-banner {
    flex-direction: row;
  }

  .live-team.away .live-team-banner {
    flex-direction: row-reverse;
  }

  .live-logo {
    width: 72px;
    height: 72px;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    object-position: center;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.65));
    flex-shrink: 0;
  }

  .live-info {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-width: 0;
    height: 100%;
    overflow: hidden;
  }

  .live-name {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 0 3px 6px rgba(0,0,0,0.75);
    white-space: nowrap;
    text-align: center;
    line-height: 1.1;
  }

  .live-score-box {
    width: 122px;
    height: 92px;
    background: #090c12;
    position: relative;
    overflow: hidden;
    border-left: 1px solid rgba(255,255,255,0.12);
    border-right: 1px solid rgba(255,255,255,0.12);
    flex-shrink: 0;
  }

  .score-track {
    width: 100%;
    height: 276px;
    display: flex;
    flex-direction: column;
    transform: translateY(0);
  }

  .score-slot {
    width: 122px;
    height: 92px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    font-weight: 900;
    flex-shrink: 0;
  }

  .score-slot.plus-badge {
    color: #38bdf8;
    font-size: 48px;
    background: #090c12;
  }

  @keyframes slideScoreSequence {
    0%   { transform: translateY(0); }
    18%  { transform: translateY(-92px); }
    72%  { transform: translateY(-92px); }
    92%  { transform: translateY(-184px); }
    100% { transform: translateY(-184px); }
  }

  .animating-slide {
    animation: slideScoreSequence 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .live-center-period {
    width: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #141923;
    color: #facc15;
    flex-shrink: 0;
    border-left: 1px solid rgba(255,255,255,0.12);
    border-right: 1px solid rgba(255,255,255,0.12);
  }

  .live-center-set-title {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 1.5px;
    line-height: 1.05;
  }

  .live-center-set-score {
    font-size: 30px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 2px;
    margin-top: 3px;
    line-height: 1.05;
  }

  /* 底部資訊列與暫停牌 (1st / 2nd TIME OUT) */
  .live-bottom-bar {
    background: #090d14;
    color: #ffffff;
    height: 50px;
    padding: 2px 18px;
    border-top: 2px solid rgba(255, 255, 255, 0.12);
    display: grid;
    grid-template-columns: 447px 150px 447px;
    align-items: center;
    justify-content: center;
    width: 100%;
    position: relative;
    overflow: hidden;
  }

  .live-to-slot {
    display: flex;
    align-items: center;
    height: 100%;
    z-index: 2;
  }

  .live-to-slot.home {
    justify-content: flex-end;
    padding-right: 4px;
  }

  .live-to-slot.away {
    justify-content: flex-start;
    padding-left: 4px;
  }

  .timeout-badge {
    display: none;
    background: linear-gradient(180deg, #991b1b 0%, #7f1d1d 100%);
    color: #ffffff;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 1.2px;
    padding: 4px 18px;
    border-radius: 3px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.65);
    text-transform: uppercase;
    line-height: 1.1;
    animation: popTimeout 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .timeout-badge.active {
    display: inline-flex;
    align-items: baseline;
  }

  .timeout-badge sup {
    font-size: 12px;
    margin-right: 4px;
    font-weight: 900;
  }

  @keyframes popTimeout {
    0% { transform: translateY(-6px) scale(0.95); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  .live-title-wrap {
    position: absolute;
    left: 18px;
    right: 18px;
    top: 2px;
    bottom: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  .live-title-text {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-align: center;
    color: #f8fafc;
    line-height: 1.15;
    white-space: pre;
    transition: opacity 0.2s ease;
  }

  .live-bottom-bar.has-timeout .live-title-text {
    opacity: 0.2;
  }

  /* =========================================================
     2. 排球局數總計分板 (?view=volleyball_summary)
     ========================================================= */
  .scoreboard {
    width: 1080px;
    background: linear-gradient(180deg, #161c24 0%, #090c10 100%);
    color: #ffffff;
    border-bottom: 3px solid #2a3546;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
    user-select: none;
    border-radius: 8px;
    overflow: hidden;
  }

  .row {
    display: grid;
    grid-template-columns: 360px 110px 100px 100px 100px 100px 100px 110px;
    align-items: center;
  }

  .header-row {
    height: 58px;
    padding: 4px 0;
    background: #0c1017;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 1px;
    border-bottom: 1px solid #262f3d;
  }

  .league-title-wrap {
    width: 360px;
    height: 50px;
    padding: 0 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .league-title {
    font-style: italic;
    font-size: 23px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 1px;
    line-height: 1.18;
    white-space: pre;
    text-align: center;
  }

  .col-q { text-align: center; color: #e0e6ed; }
  .col-q sup { font-size: 13px; }
  .col-total-header {
    text-align: center;
    color: #d4af37;
    font-size: 22px;
    letter-spacing: 2px;
  }

  .team-row {
    height: 68px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .team-banner {
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 32px 0 16px;
    clip-path: polygon(0 0, 100% 0, 93% 100%, 0% 100%);
    gap: 14px;
    overflow: hidden;
  }

  .team-logo {
    height: 56px;
    width: 56px;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    object-position: center;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.55));
    flex-shrink: 0;
  }

  .team-name-wrap {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .team-name {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 1px 2px 5px rgba(0, 0, 0, 0.65);
    white-space: nowrap;
    text-align: center;
    line-height: 1.1;
  }

  .score-q {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    color: #b0b8c4;
  }

  .score-total {
    text-align: center;
    font-size: 38px;
    font-weight: 900;
    color: #ffffff;
  }

  /* =========================================================
     3. 控制台
     ========================================================= */
  #control-section {
    width: 100%;
    max-width: 1080px;
    background: #181d26;
    border: 1px solid #2a3140;
    border-radius: 10px;
    padding: 18px;
  }

  .ctrl-top-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-bottom: 14px;
    margin-bottom: 16px;
    border-bottom: 1px solid #2a3140;
  }

  .fb-status-badge {
    font-size: 12px;
    font-weight: bold;
    padding: 5px 10px;
    border-radius: 999px;
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
  }

  .fb-status-badge.online {
    background: rgba(22, 163, 74, 0.15);
    color: #4ade80;
    border-color: #16a34a;
  }

  .fb-status-badge.error {
    background: rgba(220, 38, 38, 0.2);
    color: #fca5a5;
    border-color: #ef4444;
  }

  .period-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .period-btn {
    background: #283040;
    color: #cbd5e1;
    border: 1px solid #3b465c;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }

  .period-btn.active {
    background: #eab308;
    color: #000000;
    border-color: #facc15;
  }

  .teams-ctrl-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 768px) {
    .teams-ctrl-grid {
      grid-template-columns: 1fr;
    }
  }

  .team-ctrl-card {
    background: #1f2633;
    border: 1px solid #313b4e;
    border-radius: 8px;
    padding: 16px;
  }

  .ctrl-row {
    margin-bottom: 12px;
  }

  .ctrl-row:last-child {
    margin-bottom: 0;
  }

  .ctrl-row label {
    display: block;
    font-size: 12.5px;
    color: #94a3b8;
    margin-bottom: 5px;
    font-weight: bold;
  }

  .input-with-color {
    display: flex;
    gap: 8px;
  }

  .team-name-input {
    flex: 1;
    background: #0f131a;
    border: 1px solid #3b465c;
    border-radius: 6px;
    padding: 8px 12px;
    color: #ffffff;
    font-size: 15px;
    font-weight: bold;
    resize: vertical;
  }

  .color-picker-input {
    width: 40px;
    height: 38px;
    border: 1px solid #3b465c;
    border-radius: 6px;
    background: none;
    cursor: pointer;
    padding: 0;
  }

  .logo-upload-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    background: #333d52;
    color: #ffffff;
    border: 1px solid #475569;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }

  .ctrl-btn:hover {
    background: #404c66;
  }

  .score-btn-group {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .score-btn {
    padding: 14px 0;
    border: none;
    border-radius: 6px;
    font-size: 17px;
    font-weight: 900;
    color: #ffffff;
    cursor: pointer;
    transition: transform 0.1s;
  }

  .score-btn:active {
    transform: scale(0.95);
  }

  .btn-p1 { background: #0284c7; }
  .btn-p2 { background: #16a34a; }
  .btn-m1 { background: #dc2626; }

  /* 發球權與暫停控制列 */
  .tactical-btn-group {
    display: grid;
    grid-template-columns: 1.1fr 1.1fr auto;
    gap: 8px;
    align-items: stretch;
  }

  .serve-btn {
    background: #283040;
    color: #e2e8f0;
    border: 1px solid #475569;
    border-radius: 6px;
    padding: 11px 10px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  .serve-btn.active {
    background: linear-gradient(180deg, #d7b47c 0%, #b88c4a 100%);
    color: #2b1704;
    border-color: #fde68a;
    box-shadow: 0 0 12px rgba(215, 180, 124, 0.45);
  }

  .to-btn {
    background: #881337;
    color: #ffffff;
    border: 1px solid #be123c;
    border-radius: 6px;
    padding: 11px 10px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s ease;
  }

  .to-btn.active {
    background: #dc2626;
    border-color: #fca5a5;
    box-shadow: 0 0 12px rgba(220, 38, 38, 0.5);
  }

  .to-sub-btn {
    background: #283040;
    color: #cbd5e1;
    border: 1px solid #3b465c;
    border-radius: 6px;
    padding: 0 12px;
    font-size: 12.5px;
    font-weight: bold;
    cursor: pointer;
  }

  .to-sub-btn:hover {
    background: #333d52;
  }
</style>
</head>
<body>

  <!-- 1. 場上即時計分板 (?view=volleyball_live) -->
  <div id="live-section">
    <div class="preview-label">▼ 預覽 1：場上即時計分板（OBS 連結參數：?view=volleyball_live）</div>
    <div class="scale-outer" id="scale-outer-live">
      <div class="scale-inner" id="scale-inner-live">
        <div class="live-scorebug-wrapper">
          <div class="live-scorebug">
            <!-- 主隊 (左側) -->
            <div class="live-team home">
              <!-- 主隊發球圖示 (最左側) -->
              <div class="live-serve-tab" id="live-t1-serve">
                <svg class="serve-ball-svg" viewBox="0 0 24 24">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 2.07c3.07.38 5.67 2.35 6.96 5.08-2.34-.65-4.88-.32-6.96.85V4.07zM8.1 4.96c.88-.48 1.86-.79 2.9-.89v4.85c-1.85.85-3.32 2.37-4.08 4.25-1.12-1.89-1.36-4.18-.57-6.29.46-.73 1.05-1.38 1.75-1.92zM4.26 14.54c.67-2.29 2.27-4.18 4.44-5.15.96 1.73 2.58 3.04 4.54 3.61l-1.92 3.33c-2.73-.19-5.26-1.56-7.06-1.79zm7.74 5.46c-1.15 0-2.25-.24-3.25-.68l1.97-3.41c2.22.12 4.41-.62 6.03-2.12.92 1.63 1.24 3.55.89 5.41-1.61.52-3.58.8-5.64.8zm6.92-2.22c.13-1.63-.29-3.27-1.19-4.65 1.1-.88 2.45-1.38 3.86-1.42.11.61.17 1.24.17 1.89 0 1.56-.45 3.01-1.23 4.24-.52-.04-1.06-.05-1.61-.06z"/>
                </svg>
              </div>
              <div class="live-team-banner" id="live-t1-bg" style="background: #0d5c3d;">
                <img id="live-t1-logo" class="live-logo" src="" alt="" style="display:none;">
                <div class="live-info" id="live-t1-info">
                  <div class="live-name" id="live-t1-name">臺中連莊</div>
                </div>
              </div>
              <div class="live-score-box" id="box-t1">
                <div class="score-track" id="track-t1">
                  <div class="score-slot" id="slot-t1-cur">0</div>
                  <div class="score-slot plus-badge" id="slot-t1-plus">+1</div>
                  <div class="score-slot" id="slot-t1-next">0</div>
                </div>
              </div>
            </div>

            <!-- 排球專屬中央局數顯示 -->
            <div class="live-center-period">
              <div class="live-center-set-title" id="live-set-title">SET 1</div>
              <div class="live-center-set-score" id="live-set-score">0 - 0</div>
            </div>

            <!-- 客隊 (右側，因 row-reverse 故發球圖示在最外側右端) -->
            <div class="live-team away">
              <div class="live-serve-tab" id="live-t2-serve">
                <svg class="serve-ball-svg" viewBox="0 0 24 24">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 2.07c3.07.38 5.67 2.35 6.96 5.08-2.34-.65-4.88-.32-6.96.85V4.07zM8.1 4.96c.88-.48 1.86-.79 2.9-.89v4.85c-1.85.85-3.32 2.37-4.08 4.25-1.12-1.89-1.36-4.18-.57-6.29.46-.73 1.05-1.38 1.75-1.92zM4.26 14.54c.67-2.29 2.27-4.18 4.44-5.15.96 1.73 2.58 3.04 4.54 3.61l-1.92 3.33c-2.73-.19-5.26-1.56-7.06-1.79zm7.74 5.46c-1.15 0-2.25-.24-3.25-.68l1.97-3.41c2.22.12 4.41-.62 6.03-2.12.92 1.63 1.24 3.55.89 5.41-1.61.52-3.58.8-5.64.8zm6.92-2.22c.13-1.63-.29-3.27-1.19-4.65 1.1-.88 2.45-1.38 3.86-1.42.11.61.17 1.24.17 1.89 0 1.56-.45 3.01-1.23 4.24-.52-.04-1.06-.05-1.61-.06z"/>
                </svg>
              </div>
              <div class="live-team-banner" id="live-t2-bg" style="background: #1b4965;">
                <img id="live-t2-logo" class="live-logo" src="" alt="" style="display:none;">
                <div class="live-info" id="live-t2-info">
                  <div class="live-name" id="live-t2-name">台鋼天鷹</div>
                </div>
              </div>
              <div class="live-score-box" id="box-t2">
                <div class="score-track" id="track-t2">
                  <div class="score-slot" id="slot-t2-cur">0</div>
                  <div class="score-slot plus-badge" id="slot-t2-plus">+1</div>

<script>
  // 防止行動裝置雙擊縮放
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      if (e.cancelable) e.preventDefault();
      if (e.target && typeof e.target.click === 'function') e.target.click();
    }
    lastTouchEnd = now;
  }, { passive: false });

  // 支援 ?view=volleyball_live 或 #volleyball_live 兩種網址參數寫法
  const params = new URLSearchParams(window.location.search);
  const hashVal = window.location.hash.replace('#', '');
  const viewParam = params.get('view') || hashVal;
  const isOBSView = (viewParam === 'volleyball_live' || viewParam === 'volleyball_summary');

  if (viewParam === 'volleyball_live') {
    document.body.classList.add('view-live');
  } else if (viewParam === 'volleyball_summary') {
    document.body.classList.add('view-summary');
  } else {
    document.body.classList.add('view-control');
  }

  // =========================================================
  // 自動文字縮放與置中引擎
  // =========================================================
  function fitElementToBox(textEl, wrapEl, maxFontPx, minFontPx, lineHeightSingle, lineHeightMulti) {
    if (!textEl || !wrapEl || wrapEl.offsetParent === null) return;
    const rawText = textEl.textContent || '';
    const isMultiLine = rawText.includes('\n');

    textEl.style.lineHeight = isMultiLine ? String(lineHeightMulti) : String(lineHeightSingle);

    const maxW = Math.max(20, wrapEl.clientWidth - 8);
    const maxH = Math.max(16, wrapEl.clientHeight - 2);

    let size = isMultiLine ? Math.min(maxFontPx, Math.floor(maxH / 2.15)) : maxFontPx;
    textEl.style.fontSize = `${size}px`;

    while (size > minFontPx && (textEl.scrollWidth > maxW || textEl.scrollHeight > maxH)) {
      size -= 0.5;
      textEl.style.fontSize = `${size}px`;
    }
  }

  function autoFitAllTexts() {
    // 1. 場上即時計分板：底欄賽事標題 (單行最大 27px，若有換行或超長自動縮小)
    fitElementToBox(
      document.getElementById('live-title-display'),
      document.getElementById('live-title-wrap'),
      27, 11, 1.15, 1.12
    );

    // 2. 局數總計分板：左上角賽事標題 (自動置中，超出 360px 範圍或換行時自動縮小)
    fitElementToBox(
      document.getElementById('sum-league-title'),
      document.getElementById('sum-league-wrap'),
      23, 11, 1.2, 1.15
    );

    // 3. 兩隊名稱：場上即時計分板 (最大 48px) & 局數總計分板 (最大 36px)
    ['t1', 't2'].forEach(k => {
      fitElementToBox(
        document.getElementById(`live-${k}-name`),
        document.getElementById(`live-${k}-info`),
        48, 18, 1.1, 1.05
      );
      fitElementToBox(
        document.getElementById(`sum-${k}-name`),
        document.getElementById(`sum-${k}-name-wrap`),
        36, 16, 1.1, 1.05
      );
    });
  }

  // =========================================================
  // Firebase 與雙核心同步設定 (SDK + REST API 雙保險)
  // =========================================================
  const FB_BASE_URL = "https://volleyball-score-0000-default-rtdb.asia-southeast1.firebasedatabase.app";
  const META_STORAGE_KEY = 'vb_meta_v3';     // 儲存賽事名稱、隊名、顏色、Logo (歸零時保留)
  const RECORD_STORAGE_KEY = 'vb_record_v3'; // 儲存比分、勝局、暫停、發球方 (歸零時刪除重整)
  const channel = new BroadcastChannel('volleyball_sync_v3');

  let db = null;
  let dbRootRef = null;
  let dbMetaRef = null;
  let dbRecordRef = null;
  let dbResetRef = null;

  try {
    firebase.initializeApp({ databaseURL: FB_BASE_URL });
    db = firebase.database();
    dbRootRef = db.ref('volleyball_scoreboard');
    dbMetaRef = db.ref('volleyball_scoreboard/meta');
    dbRecordRef = db.ref('volleyball_scoreboard/record');
    dbResetRef = db.ref('volleyball_scoreboard/resetSignal');
  } catch (err) {
    console.warn('Firebase SDK 初始化備援:', err);
  }

  function updateStatusBadge(status, msg) {
    const badge = document.getElementById('fb-status');
    if (!badge) return;
    badge.classList.remove('online', 'error');
    if (status === 'online') {
      badge.textContent = msg || '🟢 Firebase 雲端同步正常';
      badge.classList.add('online');
    } else if (status === 'error') {
      badge.textContent = msg || '⚠️ Firebase 權限未開 (請將 Rules 設為 true)';
      badge.classList.add('error');
    } else {
      badge.textContent = msg || '🔴 離線 (本機模式)';
    }
  }

  function makeSyncId() {
    return `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  }

  // 預設球隊與賽事設定 (歸零時保留)
  function getDefaultMeta() {
    return {
      gameTitle: '台灣職業排球聯賽 例行賽',
      t1: { name: '臺中連莊', color: '#0d5c3d', logo: '' },
      t2: { name: '台鋼天鷹', color: '#1b4965', logo: '' },
      syncId: 'init_meta'
    };
  }

  // 預設比賽紀錄 (歸零時重置為此乾淨狀態)
  function getDefaultRecord() {
    return {
      currentSet: 1,
      servingTeam: '',
      t1: { s1: 0, s2: '', s3: '', s4: '', s5: '', toCount: 0, toShowing: false },
      t2: { s1: 0, s2: '', s3: '', s4: '', s5: '', toCount: 0, toShowing: false },
      lastAction: null,
      syncId: 'init_record'
    };
  }

  let metaState = loadLocalMeta();
  let recordState = loadLocalRecord();
  let animTimers = { t1: null, t2: null };
  let isAnimating = { t1: false, t2: false };

  let lastAppliedMetaSyncId = metaState.syncId || '';
  let lastAppliedRecordSyncId = recordState.syncId || '';
  let lastProcessedActionId = null;
  let lastKnownResetToken = 0;
  let lastLocalWriteTime = 0;

  function loadLocalMeta() {
    try {
      const saved = localStorage.getItem(META_STORAGE_KEY);
      return saved ? normalizeMeta(JSON.parse(saved)) : getDefaultMeta();
    } catch (e) {
      return getDefaultMeta();
    }
  }

  function loadLocalRecord() {
    try {
      const saved = localStorage.getItem(RECORD_STORAGE_KEY);
      return saved ? normalizeRecord(JSON.parse(saved)) : getDefaultRecord();
    } catch (e) {
      return getDefaultRecord();
    }
  }

  function normalizeMeta(raw) {
    const def = getDefaultMeta();
    if (!raw || typeof raw !== 'object') return def;
    return {
      gameTitle: raw.gameTitle !== undefined ? String(raw.gameTitle) : def.gameTitle,
      t1: {
        name: raw.t1 && raw.t1.name !== undefined ? String(raw.t1.name) : def.t1.name,
        color: raw.t1 && raw.t1.color ? String(raw.t1.color) : def.t1.color,
        logo: raw.t1 && raw.t1.logo ? String(raw.t1.logo) : ''
      },
      t2: {
        name: raw.t2 && raw.t2.name !== undefined ? String(raw.t2.name) : def.t2.name,
        color: raw.t2 && raw.t2.color ? String(raw.t2.color) : def.t2.color,
        logo: raw.t2 && raw.t2.logo ? String(raw.t2.logo) : ''
      },
      syncId: raw.syncId ? String(raw.syncId) : def.syncId
    };
  }

  function normalizeRecord(raw) {
    const def = getDefaultRecord();
    if (!raw || typeof raw !== 'object') return def;
    const t1Raw = raw.t1 || {};
    const t2Raw = raw.t2 || {};
    return {
      currentSet: Number(raw.currentSet) || 1,
      servingTeam: raw.servingTeam || '',
      t1: {
        s1: t1Raw.s1 !== undefined && t1Raw.s1 !== null && t1Raw.s1 !== '' ? Number(t1Raw.s1) : 0,
        s2: t1Raw.s2 !== undefined && t1Raw.s2 !== null && t1Raw.s2 !== '' ? Number(t1Raw.s2) : '',
        s3: t1Raw.s3 !== undefined && t1Raw.s3 !== null && t1Raw.s3 !== '' ? Number(t1Raw.s3) : '',
        s4: t1Raw.s4 !== undefined && t1Raw.s4 !== null && t1Raw.s4 !== '' ? Number(t1Raw.s4) : '',
        s5: t1Raw.s5 !== undefined && t1Raw.s5 !== null && t1Raw.s5 !== '' ? Number(t1Raw.s5) : '',
        toCount: Number(t1Raw.toCount) || 0,
        toShowing: Boolean(t1Raw.toShowing)
      },
      t2: {
        s1: t2Raw.s1 !== undefined && t2Raw.s1 !== null && t2Raw.s1 !== '' ? Number(t2Raw.s1) : 0,
        s2: t2Raw.s2 !== undefined && t2Raw.s2 !== null && t2Raw.s2 !== '' ? Number(t2Raw.s2) : '',
        s3: t2Raw.s3 !== undefined && t2Raw.s3 !== null && t2Raw.s3 !== '' ? Number(t2Raw.s3) : '',
        s4: t2Raw.s4 !== undefined && t2Raw.s4 !== null && t2Raw.s4 !== '' ? Number(t2Raw.s4) : '',
        s5: t2Raw.s5 !== undefined && t2Raw.s5 !== null && t2Raw.s5 !== '' ? Number(t2Raw.s5) : '',
        toCount: Number(t2Raw.toCount) || 0,
        toShowing: Boolean(t2Raw.toShowing)
      },
      lastAction: raw.lastAction || null,
      syncId: raw.syncId ? String(raw.syncId) : def.syncId
    };
  }

  // 儲存球隊與賽事設定 (Meta - 歸零時保留)
  async function saveMeta() {
    lastLocalWriteTime = Date.now();
    metaState.syncId = makeSyncId();
    lastAppliedMetaSyncId = metaState.syncId;

    const cleanMeta = JSON.parse(JSON.stringify(metaState));
    localStorage.setItem(META_STORAGE_KEY, JSON.stringify(cleanMeta));
    channel.postMessage({ type: 'meta_sync', meta: cleanMeta });

    if (dbMetaRef) {
      dbMetaRef.set(cleanMeta).catch((err) => {
        if (err && err.code === 'PERMISSION_DENIED') updateStatusBadge('error');
      });
    }
    try {
      const res = await fetch(`${FB_BASE_URL}/volleyball_scoreboard/meta.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cleanMeta)
      });
      if (res.ok) {
        updateStatusBadge('online');
      } else if (res.status === 401 || res.status === 403) {
        updateStatusBadge('error');
      }
    } catch (e) {}
  }

  // 儲存比賽紀錄 (Record - 分數、局數、暫停、發球)
  async function saveRecord() {
    lastLocalWriteTime = Date.now();
    recordState.syncId = makeSyncId();
    lastAppliedRecordSyncId = recordState.syncId;

    const cleanRecord = JSON.parse(JSON.stringify(recordState));
    localStorage.setItem(RECORD_STORAGE_KEY, JSON.stringify(cleanRecord));
    channel.postMessage({ type: 'record_sync', record: cleanRecord });

    if (dbRecordRef) {
      dbRecordRef.set(cleanRecord).catch((err) => {
        if (err && err.code === 'PERMISSION_DENIED') updateStatusBadge('error');
      });
    }
    try {
      const res = await fetch(`${FB_BASE_URL}/volleyball_scoreboard/record.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cleanRecord)
      });
      if (res.ok) {
        updateStatusBadge('online');
      } else if (res.status === 401 || res.status === 403) {
        updateStatusBadge('error');
      }
    } catch (e) {}
  }

  // 執行本機與 OBS 端的「僅清除比賽紀錄」動作（保留球隊名稱、代表色與 Logo）
  function performLocalRecordWipe() {
    localStorage.removeItem(RECORD_STORAGE_KEY);
    resetAnimationLocks();
    recordState = getDefaultRecord();
    lastAppliedRecordSyncId = recordState.syncId;
    lastProcessedActionId = null;
    renderUI();
  }

  // 套用遠端 Meta 設定
  function applyIncomingMeta(rawMeta) {
    if (!rawMeta) return;
    const incoming = normalizeMeta(rawMeta);
    if (incoming.syncId === lastAppliedMetaSyncId) return;
    lastAppliedMetaSyncId = incoming.syncId;
    metaState = incoming;
    localStorage.setItem(META_STORAGE_KEY, JSON.stringify(metaState));
    renderUI();
  }

  // 套用遠端 Record 比賽紀錄
  function applyIncomingRecord(rawRecord) {
    if (rawRecord === null || rawRecord === undefined) {
      if (lastAppliedRecordSyncId !== 'init_record') {
        performLocalRecordWipe();
      }
      return;
    }

    const incoming = normalizeRecord(rawRecord);
    if (incoming.syncId === lastAppliedRecordSyncId) return;
    lastAppliedRecordSyncId = incoming.syncId;

    recordState = incoming;
    localStorage.setItem(RECORD_STORAGE_KEY, JSON.stringify(recordState));

    const action = recordState.lastAction;
    if (
      action &&
      action.id &&
      action.id !== lastProcessedActionId &&
      Date.now() - action.timestamp < 8000
    ) {
      lastProcessedActionId = action.id;
      renderUI(action.teamKey);
      playScoreAnimation(action.teamKey, action.delta, action.oldScore, action.newScore);
    } else {
      if (action && action.id) lastProcessedActionId = action.id;
      renderUI();
    }
  }

  // 1. Firebase SDK 即時監聽
  if (dbMetaRef) {
    dbMetaRef.on('value', (snap) => {
      const val = snap.val();
      if (val) applyIncomingMeta(val);
    }, (err) => {
      if (err && err.code === 'PERMISSION_DENIED') updateStatusBadge('error');
    });
  }

  if (dbRecordRef) {
    dbRecordRef.on('value', (snap) => {
      const val = snap.val();
      applyIncomingRecord(val);
    });
  }

  if (dbResetRef) {
    dbResetRef.on('value', (snap) => {
      const val = snap.val();
      if (val && val.token && val.token !== lastKnownResetToken) {
        if (lastKnownResetToken !== 0) {
          performLocalRecordWipe();
        }
        lastKnownResetToken = val.token;
      }
    });
  }

  // 2. REST API 輪詢同步保底
  async function pollFirebaseREST() {
    if (!isOBSView && Date.now() - lastLocalWriteTime < 800) return;

    try {
      const res = await fetch(`${FB_BASE_URL}/volleyball_scoreboard.json?t=${Date.now()}`, {
        cache: 'no-store'
      });
      if (res.status === 401 || res.status === 403) {
        updateStatusBadge('error');
        return;
      }
      if (!res.ok) return;

      updateStatusBadge('online');
      const data = await res.json();

      if (!data) {
        if (!isOBSView) saveMeta();
        if (lastAppliedRecordSyncId !== 'init_record') performLocalRecordWipe();
        return;
      }

      if (data.meta) {
        applyIncomingMeta(data.meta);
      } else if (!isOBSView) {
        saveMeta();
      }

      if (data.resetSignal && data.resetSignal.token && data.resetSignal.token !== lastKnownResetToken) {
        if (lastKnownResetToken !== 0) {
          performLocalRecordWipe();
        }
        lastKnownResetToken = data.resetSignal.token;
      }

      if (data.record !== undefined) {
        applyIncomingRecord(data.record);
      } else {
        if (lastAppliedRecordSyncId !== 'init_record') {
          performLocalRecordWipe();
        }
      }
    } catch (e) {}
  }

  pollFirebaseREST();
  setInterval(pollFirebaseREST, 500);

  function resetAnimationLocks() {
    ['t1', 't2'].forEach(k => {
      if (animTimers[k]) {
        clearTimeout(animTimers[k]);
        animTimers[k] = null;
      }
      isAnimating[k] = false;
      const track = document.getElementById(`track-${k}`);
      if (track) {
        track.classList.remove('animating-slide');
        track.style.transform = 'translateY(0)';
      }
    });
  }

  function getTeamSetsWon(teamKey) {
    const teamObj = recordState[teamKey];
    const oppObj = recordState[teamKey === 't1' ? 't2' : 't1'];
    let setsWon = 0;
    for (let i = 1; i <= 5; i++) {
      const sVal = teamObj[`s${i}`];
      const oVal = oppObj[`s${i}`];
      if (sVal !== '' && sVal !== null && sVal !== undefined && oVal !== '' && oVal !== null && oVal !== undefined) {
        const score = Number(sVal);
        const oppScore = Number(oVal);
        const target = i === 5 ? 15 : 25;
        if (score >= target && score - oppScore >= 2) {
          setsWon++;
        }
      }
    }
    return setsWon;
  }

  function adjustResponsiveScale() {
    const pairs = [
      { outer: document.getElementById('scale-outer-live'), inner: document.getElementById('scale-inner-live') },
      { outer: document.getElementById('scale-outer-summary'), inner: document.getElementById('scale-inner-summary') }
    ];

    pairs.forEach(({ outer, inner }) => {
      if (!outer || !inner || outer.offsetParent === null) return;
      const availWidth = outer.clientWidth || (window.innerWidth - 20);
      const scale = Math.min(1, availWidth / 1080);
      inner.style.transform = `scale(${scale})`;
      outer.style.height = `${Math.ceil(inner.offsetHeight * scale)}px`;
    });

    autoFitAllTexts();
  }

  window.addEventListener('resize', adjustResponsiveScale);
  window.addEventListener('orientationchange', () => setTimeout(adjustResponsiveScale, 150));

  function renderUI(skipTeamKey = null) {
    const titleText = metaState.gameTitle || '台灣職業排球聯賽 例行賽';
    document.getElementById('live-title-display').textContent = titleText;
    const sumTitle = document.getElementById('sum-league-title');
    if (sumTitle) sumTitle.textContent = titleText;

    const gameTitleInput = document.getElementById('in-game-title');
    if (gameTitleInput && document.activeElement !== gameTitleInput) {
      gameTitleInput.value = metaState.gameTitle;
    }

    document.getElementById('live-set-title').textContent = `SET ${recordState.currentSet}`;
    const t1Sets = getTeamSetsWon('t1');
    const t2Sets = getTeamSetsWon('t2');
    document.getElementById('live-set-score').textContent = `${t1Sets} - ${t2Sets}`;

    for (let p = 1; p <= 5; p++) {
      const btn = document.getElementById(`pbtn-${p}`);
      if (btn) btn.classList.toggle('active', recordState.currentSet === p);
    }

    // 發球權顯示更新
    ['t1', 't2'].forEach(k => {
      const isServing = recordState.servingTeam === k;
      const serveTab = document.getElementById(`live-${k}-serve`);
      if (serveTab) serveTab.classList.toggle('active', isServing);

      const serveBtn = document.getElementById(`btn-serve-${k}`);
      if (serveBtn) {
        serveBtn.classList.toggle('active', isServing);
        serveBtn.textContent = isServing ? '🏐 發球中' : '🏐 發球權';
      }
    });

    // 暫停牌與底欄狀態更新
    const anyTimeoutShowing =
      (recordState.t1.toShowing && recordState.t1.toCount > 0) ||
      (recordState.t2.toShowing && recordState.t2.toCount > 0);
    const bottomBar = document.getElementById('live-bottom-bar');
    if (bottomBar) bottomBar.classList.toggle('has-timeout', anyTimeoutShowing);

    ['t1', 't2'].forEach(k => {
      const m = metaState[k];
      const r = recordState[k];
      const curSetScore = (r[`s${recordState.currentSet}`] !== null && r[`s${recordState.currentSet}`] !== undefined && r[`s${recordState.currentSet}`] !== '')
        ? r[`s${recordState.currentSet}`]
        : 0;

      // 隊名、代表色與 Logo
      document.getElementById(`live-${k}-name`).textContent = m.name;
      document.getElementById(`live-${k}-bg`).style.background = m.color;

      const liveLogo = document.getElementById(`live-${k}-logo`);
      if (m.logo) {
        liveLogo.src = m.logo;
        liveLogo.style.display = 'block';
      } else {
        liveLogo.style.display = 'none';
      }

      // 分數顯示
      if (skipTeamKey !== k && !isAnimating[k]) {
        const track = document.getElementById(`track-${k}`);
        track.classList.remove('animating-slide');
        track.style.transform = 'translateY(0)';
        document.getElementById(`slot-${k}-cur`).textContent = curSetScore;
        document.getElementById(`slot-${k}-next`).textContent = curSetScore;
      }

      // 1st TIME OUT / 2nd TIME OUT 標籤
      const toBadge = document.getElementById(`live-${k}-to`);
      if (toBadge) {
        if (r.toShowing && r.toCount > 0) {
          const ordSup = r.toCount === 1 ? 'st' : 'nd';
          toBadge.innerHTML = `${r.toCount}<sup>${ordSup}</sup> TIME OUT`;
          toBadge.classList.add('active');
        } else {
          toBadge.classList.remove('active');
        }
      }

      // 控制台暫停狀態文字
      const toStatus = document.getElementById(`to-status-${k}`);
      if (toStatus) {
        toStatus.textContent = `${r.toCount || 0} / 2${r.toShowing ? ' (顯示中)' : ''}`;
      }
      const toBtn = document.getElementById(`btn-to-${k}`);
      if (toBtn) {
        toBtn.classList.toggle('active', Boolean(r.toShowing && r.toCount > 0));
      }

      // 局數總計分板 (Summary)
      document.getElementById(`sum-${k}-name`).textContent = m.name;
      document.getElementById(`sum-${k}-bg`).style.background = `linear-gradient(90deg, ${m.color}dd 0%, ${m.color} 100%)`;
      const sumLogo = document.getElementById(`sum-${k}-logo`);
      if (m.logo) {
        sumLogo.src = m.logo;
        sumLogo.style.display = 'block';
      } else {
        sumLogo.style.display = 'none';
      }

      for (let s = 1; s <= 5; s++) {
        const val = r[`s${s}`];
        const el = document.getElementById(`sum-${k}-s${s}`);
        if (el) el.textContent = (val === null || val === '' || val === undefined) ? '' : val;
      }
      document.getElementById(`sum-${k}-sets`).textContent = getTeamSetsWon(k);

      // 控制台輸入框同步
      const nameInput = document.getElementById(`in-${k}-name`);
      if (nameInput && document.activeElement !== nameInput) nameInput.value = m.name;
      const colorInput = document.getElementById(`in-${k}-color`);
      if (colorInput && document.activeElement !== colorInput) colorInput.value = m.color;
      const delLogoBtn = document.getElementById(`del-logo-${k}`);
      if (delLogoBtn) delLogoBtn.style.display = m.logo ? 'inline-block' : 'none';
    });

    adjustResponsiveScale();
  }

  function playScoreAnimation(teamKey, delta, oldScore, newScore) {
    if (animTimers[teamKey]) {
      clearTimeout(animTimers[teamKey]);
      animTimers[teamKey] = null;
    }

    const track = document.getElementById(`track-${teamKey}`);
    const curSlot = document.getElementById(`slot-${teamKey}-cur`);
    const plusSlot = document.getElementById(`slot-${teamKey}-plus`);
    const nextSlot = document.getElementById(`slot-${teamKey}-next`);

    track.classList.remove('animating-slide');

    if (delta > 0) {
      isAnimating[teamKey] = true;
      curSlot.textContent = oldScore;
      plusSlot.textContent = `+${delta}`;
      nextSlot.textContent = newScore;
      void track.offsetWidth;
      track.classList.add('animating-slide');

      animTimers[teamKey] = setTimeout(() => {
        isAnimating[teamKey] = false;
        track.classList.remove('animating-slide');
        track.style.transform = 'translateY(0)';
        curSlot.textContent = newScore;
      }, 1360);
    } else {
      isAnimating[teamKey] = false;
      curSlot.textContent = newScore;
      nextSlot.textContent = newScore;
    }
  }

  // 發球權設定與切換
  function toggleServe(teamKey) {
    recordState.servingTeam = (recordState.servingTeam === teamKey) ? '' : teamKey;
    recordState.lastAction = null;
    renderUI();
    saveRecord();
  }

  function switchServe() {
    recordState.servingTeam = (recordState.servingTeam === 't1') ? 't2' : 't1';
    recordState.lastAction = null;
    renderUI();
    saveRecord();
  }

  // TO +1 按鍵邏輯：0 -> 1st TIME OUT -> 2nd TIME OUT -> 歸零關閉
  function triggerTimeOut(teamKey) {
    const r = recordState[teamKey];
    const curCount = Number(r.toCount) || 0;

    if (curCount === 0) {
      r.toCount = 1;
      r.toShowing = true;
    } else if (curCount === 1) {
      r.toCount = 2;
      r.toShowing = true;
    } else {
      if (!r.toShowing) {
        r.toShowing = true;
      } else {
        r.toCount = 0;
        r.toShowing = false;
      }
    }

    recordState.lastAction = null;
    renderUI();
    saveRecord();
  }

  function hideTimeOut(teamKey) {
    recordState[teamKey].toShowing = false;
    recordState.lastAction = null;
    renderUI();
    saveRecord();
  }

  function addScore(teamKey, delta) {
    const sKey = `s${recordState.currentSet}`;
    const oldScore = Number(recordState[teamKey][sKey] || 0);
    recordState[teamKey][sKey] = Math.max(0, oldScore + delta);
    const newScore = Number(recordState[teamKey][sKey]);

    // 得分時自動收起暫停字卡並將發球權指向得分隊伍
    if (delta > 0) {
      recordState.t1.toShowing = false;
      recordState.t2.toShowing = false;
      recordState.servingTeam = teamKey;
    }

    const actionId = makeSyncId();
    lastProcessedActionId = actionId;
    recordState.lastAction = {
      id: actionId,
      teamKey,
      delta,
      oldScore,
      newScore,
      timestamp: Date.now()
    };

    renderUI(teamKey);
    playScoreAnimation(teamKey, delta, oldScore, newScore);
    saveRecord();
  }

  function changeSet(s) {
    recordState.currentSet = s;
    const sKey = `s${s}`;
    if (recordState.t1[sKey] === null || recordState.t1[sKey] === undefined || recordState.t1[sKey] === '') recordState.t1[sKey] = 0;
    if (recordState.t2[sKey] === null || recordState.t2[sKey] === undefined || recordState.t2[sKey] === '') recordState.t2[sKey] = 0;

    // 換局時自動重設兩隊單局暫停紀錄
    recordState.t1.toCount = 0;
    recordState.t1.toShowing = false;
    recordState.t2.toCount = 0;
    recordState.t2.toShowing = false;
    recordState.lastAction = null;

    renderUI();
    saveRecord();
  }

  // 更新賽事名稱、隊名、顏色、Logo (儲存在 meta，歸零重設時絕對保留)
  function updateGameTitle() {
    metaState.gameTitle = document.getElementById('in-game-title').value;
    renderUI();
    saveMeta();
  }

  function updateTeamMeta(teamKey) {
    metaState[teamKey].name = document.getElementById(`in-${teamKey}-name`).value;
    metaState[teamKey].color = document.getElementById(`in-${teamKey}-color`).value;
    renderUI();
    saveMeta();
  }

  function uploadLogo(teamKey, inputEl) {
    const file = inputEl.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      metaState[teamKey].logo = e.target.result;
      renderUI();
      saveMeta();
    };
    reader.readAsDataURL(file);
  }

  function removeLogo(teamKey) {
    metaState[teamKey].logo = '';
    const fileInput = document.getElementById(`file-${teamKey}`);
    if (fileInput) fileInput.value = '';
    renderUI();
    saveMeta();
  }

  // =========================================================
  // 歸零重設：僅刪除並重置「比賽紀錄 (record)」
  // 完整保留「球隊名稱、代表色、Logo、賽事名稱 (meta)」並強制同步 OBS
  // =========================================================
  async function resetAllScores() {
    lastLocalWriteTime = Date.now();
    const token = Date.now();
    lastKnownResetToken = token;

    // 1. 本機清除比賽紀錄快取並將畫面歸零 (不動 META_STORAGE_KEY)
    performLocalRecordWipe();

    // 2. 通知同瀏覽器分頁歸零比賽紀錄
    channel.postMessage({ type: 'reset_record_only', token });

    // 3. 在 Firebase 刪除 record 節點，並發送 resetSignal 讓所有 OBS 端同步清除紀錄
    if (dbRecordRef) {
      dbRecordRef.remove().catch(() => {});
    }
    if (dbResetRef) {
      dbResetRef.set({ token }).catch(() => {});
    }

    try {
      await Promise.all([
        fetch(`${FB_BASE_URL}/volleyball_scoreboard/record.json`, { method: 'DELETE' }),
        fetch(`${FB_BASE_URL}/volleyball_scoreboard/resetSignal.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        })
      ]);
      updateStatusBadge('online');
    } catch (e) {
      console.error('Firebase 紀錄刪除失敗:', e);
    }
  }

  // 同電腦跨分頁同步
  channel.onmessage = (ev) => {
    if (!ev.data) return;
    if (ev.data.type === 'meta_sync') {
      applyIncomingMeta(ev.data.meta);
    } else if (ev.data.type === 'record_sync') {
      applyIncomingRecord(ev.data.record);
    } else if (ev.data.type === 'reset_record_only') {
      lastKnownResetToken = ev.data.token || Date.now();
      performLocalRecordWipe();
    }
  };

  window.addEventListener('storage', (ev) => {
    if (ev.key === META_STORAGE_KEY && ev.newValue) {
      applyIncomingMeta(JSON.parse(ev.newValue));
    } else if (ev.key === RECORD_STORAGE_KEY) {
      if (!ev.newValue) {
        performLocalRecordWipe();
      } else {
        applyIncomingRecord(JSON.parse(ev.newValue));
      }
    }
  });

  renderUI();
</script>
</body>
</html>
